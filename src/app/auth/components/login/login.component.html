<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 py-8 px-4">
  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md relative overflow-hidden">
    <!-- Élément décoratif -->
    <div class="absolute -top-16 -right-16 w-32 h-32 rounded-full bg-blue-200 opacity-50"></div>
    <div class="absolute -bottom-12 -left-12 w-28 h-28 rounded-full bg-indigo-200 opacity-50"></div>
    
    <div class="relative z-10">
      <!-- En-tête avec icône -->
      <div class="text-center mb-6">
        <div class="mx-auto w-16 h-16 flex items-center justify-center bg-blue-100 rounded-full mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" />
          </svg>
        </div>
        <h2 class="text-3xl font-bold text-gray-800">Content de vous revoir</h2>
        <p class="text-gray-500 mt-2">Connectez-vous à votre compte</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-5">
        <!-- Champ Username -->
        <div>
          <label class="block text-gray-700 text-sm font-medium mb-2">Nom d'utilisateur ou email</label>
          <div class="relative">
            <span class="absolute left-3 top-3 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </span>
            <input type="text" formControlName="username"
                   class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                   placeholder="Entrez votre nom d'utilisateur"
                   [class.border-red-500]="loginForm.controls.username.invalid && loginForm.controls.username.touched">
          </div>
          <div *ngIf="loginForm.controls.username.invalid && loginForm.controls.username.touched"
               class="text-red-500 text-sm mt-1">
            <span *ngIf="loginForm.controls.username.errors?.['required']">
              Ce champ est obligatoire
            </span>
          </div>
        </div>

        <!-- Champ Mot de passe -->
        <div>
          <label class="block text-gray-700 text-sm font-medium mb-2">Mot de passe</label>
          <div class="relative">
            <span class="absolute left-3 top-3 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input type="password" formControlName="password"
                   class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                   placeholder="Entrez votre mot de passe"
                   [class.border-red-500]="loginForm.controls.password.invalid && loginForm.controls.password.touched">
          </div>
          <div *ngIf="loginForm.controls.password.invalid && loginForm.controls.password.touched"
               class="text-red-500 text-sm mt-1">
            <span *ngIf="loginForm.controls.password.errors?.['required']">
              Le mot de passe est requis
            </span>
            <span *ngIf="loginForm.controls.password.errors?.['minlength']">
              Minimum 8 caractères
            </span>
          </div>
        </div>

        <!-- Se souvenir de moi et mot de passe oublié -->
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label for="remember-me" class="ml-2 block text-sm text-gray-700">Se souvenir de moi</label>
          </div>
          <div class="text-sm">
            <a routerLink="/forgot-password" class="font-medium text-blue-600 hover:text-blue-500 transition">
              Mot de passe oublié ?
            </a>
          </div>
        </div>

        <!-- Message d'erreur général -->
        <div *ngIf="errorMessage" class="p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-center text-sm">
          {{ errorMessage }}
        </div>

        <!-- Bouton de connexion -->
        <button type="submit"
                [disabled]="loginForm.invalid || isLoading"
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3 rounded-lg hover:from-blue-700 hover:to-indigo-700 transition shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2">
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Connexion en cours...
          </span>
        </button>

        <!-- Séparateur -->
        <div class="relative flex items-center">
          <div class="flex-grow border-t border-gray-200"></div>
          <span class="flex-shrink mx-4 text-gray-400 text-sm">Ou continuer avec</span>
          <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <!-- Boutons de connexion sociale -->
        <div class="grid grid-cols-2 gap-3">
          <button type="button" class="flex items-center justify-center gap-2 bg-white text-gray-700 py-2.5 px-4 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm-2 20h-4v-8h4v8zm-2-10.669c-.989-.669-1.667-1.657-1.667-2.831 0-1.931 1.567-3.5 3.5-3.5s3.5 1.569 3.5 3.5c0 1.174-.678 2.162-1.667 2.831v3.169h-3v-3.169zm6 3.169h-3v2h3v-2zm-6 0h-3v2h3v-2z"/>
            </svg>
            Google
          </button>
          <button type="button" class="flex items-center justify-center gap-2 bg-white text-gray-700 py-2.5 px-4 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
            <svg class="w-5 h-5 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Facebook
          </button>
        </div>

        <!-- Lien vers inscription -->
        <div class="text-center text-sm pt-2">
          <span class="text-gray-600">Pas encore de compte ? </span>
          <a routerLink="/register" class="font-medium text-blue-600 hover:text-blue-500 transition">
            S'inscrire
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
