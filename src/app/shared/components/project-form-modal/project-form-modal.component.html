<div class="fixed inset-0  backdrop-blur-sm flex items-center justify-center z-50 overflow-y-auto">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-md transform transition-all my-8 max-h-[90vh] overflow-y-auto">
    <div class="p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">{{ isEditMode ? 'Modifier le projet' : 'Nouveau Projet' }}</h2>
        <button (click)="closeModal()" class="text-gray-500 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="name">Nom du projet*</label>
          <input 
            type="text" 
            id="name" 
            [(ngModel)]="formData.name" 
            name="name"
            class="w-full px-3 py-2 border rounded-lg"
            required
            (input)="clearMessages()"
          >
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="description">Description</label>
          <textarea 
            id="description" 
            [(ngModel)]="formData.description" 
            name="description"
            rows="3"
            class="w-full px-3 py-2 border rounded-lg"
            (input)="clearMessages()"
          ></textarea>
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="startDate">Date de début*</label>
          <input 
            type="date" 
            id="startDate" 
            [(ngModel)]="formData.startDate"
            name="startDate"
            class="w-full px-3 py-2 border rounded-lg"
            required
            (change)="clearMessages()"
          >
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="dueStart">Date d'échéance de début</label>
          <input 
            type="date" 
            id="dueStart" 
            [(ngModel)]="formData.dueStart"
            name="dueStart"
            class="w-full px-3 py-2 border rounded-lg"
            (change)="clearMessages()"
          >
          <p class="text-xs text-gray-500 mt-1">Date limite pour commencer le projet</p>
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="dueEnd">Date d'échéance de fin</label>
          <input 
            type="date" 
            id="dueEnd" 
            [(ngModel)]="formData.dueEnd"
            name="dueEnd"
            class="w-full px-3 py-2 border rounded-lg"
            (change)="clearMessages()"
          >
          <p class="text-xs text-gray-500 mt-1">Date limite de fin du projet (affichée dans la liste)</p>
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="endDate">Date de fin réelle</label>
          <input 
            type="date" 
            id="endDate" 
            [(ngModel)]="formData.endDate"
            name="endDate"
            class="w-full px-3 py-2 border rounded-lg"
            (change)="clearMessages()"
          >
          <p class="text-xs text-gray-500 mt-1">Date de fin effective (à remplir une fois le projet terminé)</p>
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="status">Statut*</label>
          <select 
            id="status" 
            [(ngModel)]="formData.projectStatusId" 
            name="projectStatusId"
            class="w-full px-3 py-2 border rounded-lg"
            required
            (change)="clearMessages()"
          >
            <option value="" disabled>Sélectionnez un statut</option>
            <option *ngFor="let status of statuses" [value]="status.id" [selected]="status.id === formData.projectStatusId">
              {{ status.name }}
            </option>
          </select>
        </div>

        <div *ngIf="error" class="error-message p-3 bg-red-100 rounded-lg mb-4">
          {{ error }}
        </div>

        

        <div class="flex justify-end space-x-3">
          <button 
            type="button" 
            (click)="closeModal()"
            class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-100"
          >
            Annuler
          </button>
          <button 
            type="submit" 
            [disabled]="isLoading"
            class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:bg-indigo-300 flex items-center justify-center gap-2"
          >
            @if (isLoading) {
              <span class="loading loading-spinner loading-sm"></span>
            }
            {{ isEditMode ? 'Mettre à jour' : 'Créer' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
